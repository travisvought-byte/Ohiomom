name: Monthly link check (Yoga Mom Talk)
# Requests every link on the national Yoga Mom Talk pages once a month and opens an issue
# naming any that fail, so a dead link is found by the site before a mother finds it.
# Run it by hand from the Actions tab (workflow_dispatch) after changing listings.
on:
  schedule:
    - cron: '23 9 4 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: python3 scripts/ymt_check_links.py > report.md || echo "failed=1" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Yoga Mom Talk links to review ($(date +%B\ %Y))" --body-file report.md
