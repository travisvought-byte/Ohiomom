name: Monthly link check (Yoga Mom Talk)
# Requests every link on the national Yoga Mom Talk pages once a month. When a person needs
# to look (a broken link, an address that now goes somewhere else, or a site that turns robots
# away and has not been opened in a browser lately), it opens an issue naming the links, or adds
# to the one already open, so a dead link is found by the site before a mother finds it.
# Run it by hand from the Actions tab (workflow_dispatch) after changing listings.
on:
  schedule:
    - cron: '23 9 4 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: python3 scripts/ymt_check_links.py > report.md || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Show the report
        run: |
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      # A run started by hand on another branch is a trial: it reports above and opens nothing.
      - if: steps.check.outputs.failed == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Yoga Mom Talk links to review
        run: |
          open=$(gh issue list --state open --limit 50 --json number,title | jq -r --arg t "$TITLE" '[.[] | select(.title | startswith($t))][0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "$TITLE ($(date +%B\ %Y))" --body-file report.md
          fi
      # TRIAL ONLY (removed before merge): how does the checker sort addresses known to be bad or blocked?
      - name: Trial probe
        if: github.ref != 'refs/heads/main'
        run: >
          python3 scripts/linkcheck.py --probe
          https://www.wvpti.org/ https://www.tnstep.org/ https://www.drnj.org/ https://www.indianadisabilityrights.org/
          https://www.azdisabilitylaw.org/ https://llli.org/get-help/ "https://www.parentcenterhub.org/?p=31647"
          https://www.mspti.org/ https://www.raisingspecialkids.org/ https://www.ksits.org/ https://www.driowa.org/
          https://jfs.ohio.gov/child-support https://jfs.ohio.gov/ https://energyhelp.ohio.gov/ https://www.fna.usda.gov/wic/apply
          https://msdh.ms.gov/msdhsite/_static/41,0,74.html https://www.ssa.gov/benefits/disability/apply-child.html
          || true
