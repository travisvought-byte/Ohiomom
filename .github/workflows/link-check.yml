name: Monthly link check
# Requests every Ohio listing's website once a month. When a person needs to look
# (a broken link, an address that now goes somewhere else, or a site that turns robots away
# and has not been opened in a browser lately), it opens an issue naming the links, or adds
# to the one already open, so a dead link is found by the site before a mother finds it.
on:
  schedule:
    - cron: '17 9 3 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: python3 scripts/check_links.py > report.md || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Show the report
        run: |
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      # A run started by hand on another branch is a trial: it reports above and opens nothing.
      - if: steps.check.outputs.failed == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Links to review
        run: |
          open=$(gh issue list --state open --limit 50 --json number,title | jq -r --arg t "$TITLE" '[.[] | select(.title | startswith($t))][0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "$TITLE ($(date +%B\ %Y))" --body-file report.md
          fi
