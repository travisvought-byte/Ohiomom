name: Christmas help refresh
# Downloads the list of Marine Toys for Tots local campaigns (scripts/christmas_data.py), rebuilds the Christmas
# lists on the state and county pages, and runs every check. Weekly from September through December, when
# campaigns open and close. On main it opens a pull request when anything changed. A run on another branch is a
# trial: it rebuilds, checks and keeps the downloaded list as an artifact, and opens nothing.
on:
  schedule:
    - cron: '23 11 * 9-12 1'
  workflow_dispatch:
  push:
    branches: [claude/christmas-help]
    paths: [.github/workflows/christmas-refresh.yml]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: christmas-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Download the Toys for Tots campaign list
        run: python3 scripts/christmas_data.py --fetch
      - name: Rebuild the Christmas lists and pages
        run: |
          python3 scripts/christmas_data.py
          python3 scripts/ymt_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: christmas-data
          path: |
            data/ymt/toysfortots.json
            assets/us/christmas.json
      - name: Every check the pull request would get
        run: |
          python3 scripts/ymt_validate.py
          python3 scripts/ymt_build.py --check
          python3 scripts/christmas_data.py --check
          python3 -m unittest discover tests
      - name: Open a pull request when anything changed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="data/christmas-refresh-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Refresh the Toys for Tots campaign list ($(date +%B\ %-d,\ %Y))"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh the Toys for Tots campaign list" \
            --body "Weekly refresh from toysfortots.org. Checks ran in the workflow before this was opened; merge to publish."
