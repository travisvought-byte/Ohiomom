name: Domain check (temporary)
on:
  push:
    branches: [claude/project-thread-wlt7hh]
    paths: ['.github/workflows/domain-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in http://www.yogamomtalk.com/ https://www.yogamomtalk.com/ http://ohiomom.org/ http://www.ohiomom.org/ http://ohiomom.com/ http://www.ohiomom.com/ http://yogamomtalk.org/ http://www.yogamomtalk.org/ http://www.yogamomtalk.com/ohio/report.html http://www.yogamomtalk.com/ohio/; do
            echo "== $u"
            curl -sSL -o /tmp/b -w '%{http_code} final=%{url_effective} hops=%{num_redirects}\n' --max-time 30 "$u" 2>&1 | grep -v "curl.se\|legitimacy\|secure connection\|webpage mentioned"
            grep -o "<title>[^<]*" /tmp/b | head -1
            rm -f /tmp/b
          done
          echo "== cert"; echo | openssl s_client -connect www.yogamomtalk.com:443 -servername www.yogamomtalk.com 2>/dev/null | openssl x509 -noout -subject -dates
# run 3
