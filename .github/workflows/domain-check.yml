name: Domain check (temporary)
on:
  push:
    branches: [claude/project-thread-wlt7hh]
    paths: ['.github/workflows/domain-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in yogamomtalk.com www.yogamomtalk.com ohiomom.org www.ohiomom.org ohiomom.com www.ohiomom.com yogamomtalk.org www.yogamomtalk.org; do
            echo "== $h"; dig +short A $h; dig +short CNAME $h
          done
          echo "== DNSSEC"; dig +dnssec A yogamomtalk.com @1.1.1.1 | grep -E "status|flags|RRSIG" | head; dig A yogamomtalk.com @8.8.8.8 | grep status
          for u in http://www.yogamomtalk.com/ https://www.yogamomtalk.com/ http://yogamomtalk.com/ https://yogamomtalk.com/ http://ohiomom.org/ https://ohiomom.org/ http://ohiomom.com/ https://yogamomtalk.org/ https://www.yogamomtalk.com/ohio/report.html; do
            echo "== $u"; curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url} ssl=%{ssl_verify_result}\n' --max-time 20 "$u" || true
          done
          echo "== cert"; echo | openssl s_client -connect www.yogamomtalk.com:443 -servername www.yogamomtalk.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
